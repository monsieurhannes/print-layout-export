name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run build

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main.js,manifest.json,styles.css"
          allowUpdates: true